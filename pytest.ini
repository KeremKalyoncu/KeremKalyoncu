[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers -ra
timeout = 60
markers =
    self_validation: Fast smoke tests against ephemeral tmp_path mock SVG/HTML fixtures
    e2e: End-to-end verification against real generated repo artifacts
    tier1: Tier 1 structural, XML/CSP, CLI reproducibility, and visibility checks
    tier2: Tier 2 boundary geometry, multi-viewport layout, and WCAG contrast checks
    tier3: Tier 3 pairwise interactive browser flow tests
    tier4: Tier 4 full visitor scenarios and deterministic PNG screenshot capture
