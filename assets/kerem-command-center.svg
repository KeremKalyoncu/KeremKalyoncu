<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.35" stop-color="#07152B"/>
      <stop offset="0.75" stop-color="#0A223F"/>
      <stop offset="1" stop-color="#061F38"/>
    </linearGradient>

    <linearGradient id="card-panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050C1A" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0.96"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="violet-glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>

    <linearGradient id="radar-sweep" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="ambience" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 180) scale(400 350)">
      <stop stop-color="#0284C7" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="left-ambience" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 210) scale(380 320)">
      <stop stop-color="#0D9488" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.04"/>
    </pattern>

    <clipPath id="frame-clip">
      <rect width="1200" height="420" rx="22"/>
    </clipPath>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    
    @keyframes scan-move {
      0% { transform: translateY(-420px); }
      100% { transform: translateY(420px); }
    }
    .scan-beam { animation: scan-move 7s linear infinite; }

    @keyframes pulse-ring {
      0% { r: 3px; opacity: 1; }
      50% { r: 7.5px; opacity: 0.3; }
      100% { r: 3px; opacity: 1; }
    }
    .blip-pulse { animation: pulse-ring 2.2s ease-in-out infinite; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.15; }
    }
    .cursor-blink { animation: blink 1.1s steps(2, start) infinite; }

    @keyframes eq-scale {
      0% { height: 4px; y: 18px; opacity: 0.4; }
      50% { height: 22px; y: 0px; opacity: 1; }
      100% { height: 6px; y: 16px; opacity: 0.5; }
    }
    .eq-bar { animation: eq-scale 1.2s ease-in-out infinite alternate; }
    .eq-1 { animation-delay: 0.05s; }
    .eq-2 { animation-delay: 0.25s; }
    .eq-3 { animation-delay: 0.15s; }
    .eq-4 { animation-delay: 0.45s; }
    .eq-5 { animation-delay: 0.30s; }
    .eq-6 { animation-delay: 0.60s; }
    .eq-7 { animation-delay: 0.20s; }
    .eq-8 { animation-delay: 0.50s; }
    .eq-9 { animation-delay: 0.35s; }
    .eq-10 { animation-delay: 0.10s; }
    .eq-11 { animation-delay: 0.40s; }
    .eq-12 { animation-delay: 0.55s; }
  </style>

  <g clip-path="url(#frame-clip)">
    <!-- Base Canvas -->
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#ambience)"/>
    <rect width="1200" height="420" fill="url(#left-ambience)"/>
    <rect width="1200" height="420" fill="url(#scanlines)"/>

    <!-- Subtle Cyber Grid -->
    <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
      <path d="M0 42H1200M0 84H1200M0 126H1200M0 168H1200M0 210H1200M0 252H1200M0 294H1200M0 336H1200M0 378H1200"/>
      <path d="M42 0V420M84 0V420M126 0V420M168 0V420M210 0V420M252 0V420M294 0V420M336 0V420M378 0V420M420 0V420M462 0V420M504 0V420M546 0V420M588 0V420M630 0V420M672 0V420M714 0V420M756 0V420M798 0V420M840 0V420M882 0V420M924 0V420M966 0V420M1008 0V420M1050 0V420M1092 0V420M1134 0V420M1176 0V420"/>
    </g>

    <!-- Animated Scanline Sweep -->
    <rect class="scan-beam" x="0" y="0" width="1200" height="90" fill="url(#cyan-glow)" opacity="0.04"/>

    <!-- LEFT PANEL: Command Center Terminal Window -->
    <g transform="translate(54, 38)">
      <!-- Frame Box -->
      <rect width="610" height="324" rx="14" fill="url(#card-panel)" stroke="#0E7490" stroke-width="1.2"/>
      
      <!-- Window Top Header Bar -->
      <path d="M0 14C0 6.26801 6.26801 0 14 0H596C603.732 0 610 6.26801 610 14V38H0V14Z" fill="#071326"/>
      <circle cx="22" cy="19" r="5" fill="#EF4444"/>
      <circle cx="40" cy="19" r="5" fill="#F59E0B"/>
      <circle cx="58" cy="19" r="5" fill="#10B981"/>
      <text x="82" y="24" fill="#94A3B8" class="font-mono" font-size="12" font-weight="700" letter-spacing="1.4">KEREM // COMMAND_STATION_TERMINAL_v4.0</text>
      <line x1="0" y1="38" x2="610" y2="38" stroke="#1E293B" stroke-width="1"/>

      <!-- Terminal Body Content -->
      <text x="24" y="66" fill="#38BDF8" class="font-mono" font-size="13" font-weight="600">$ whoami</text>
      <text x="24" y="100" fill="#F8FAFC" class="font-sans" font-size="30" font-weight="900" letter-spacing="-0.5">Kerem Kalyoncu</text>
      
      <!-- Subtitle -->
      <text x="24" y="126" fill="#38BDF8" class="font-mono" font-size="12.5" font-weight="700">SOFTWARE ENGINEER &amp; SYSTEMS BUILDER</text>
      <text x="24" y="146" fill="#94A3B8" class="font-mono" font-size="11.5">Real-Time Telemetry · Geospatial Computing · Practical Automation</text>

      <!-- System Diagnostic Panel -->
      <g transform="translate(20, 162)">
        <rect width="570" height="90" rx="8" fill="#030A17" stroke="#1E3A8A" stroke-width="1"/>
        
        <text x="16" y="22" fill="#38BDF8" class="font-mono" font-size="11.5" font-weight="700">$ sys.diagnostics --all</text>
        
        <!-- Indicator 1 -->
        <g transform="translate(16, 38)">
          <circle cx="4" cy="4" r="4" fill="#34D399"/>
          <text x="16" y="8" fill="#CBD5E1" class="font-mono" font-size="10.5">ENGINE: <tspan fill="#34D399" font-weight="700">ONLINE</tspan> | LAT/LON: <tspan fill="#E2E8F0">41.0082° N, 28.9784° E (TR)</tspan></text>
        </g>
        
        <!-- Indicator 2 -->
        <g transform="translate(16, 58)">
          <circle cx="4" cy="4" r="4" fill="#38BDF8"/>
          <text x="16" y="8" fill="#CBD5E1" class="font-mono" font-size="10.5">FLAGSHIP: <tspan fill="#7DD3FC" font-weight="700">MARITIME WATCH</tspan> (~1.2W EDGE SENTINEL)</text>
        </g>

        <!-- Indicator 3 & Blinking Prompt -->
        <g transform="translate(16, 76)">
          <circle cx="4" cy="4" r="4" fill="#A78BFA"/>
          <text x="16" y="8" fill="#CBD5E1" class="font-mono" font-size="10.5">STATUS: READY FOR PRODUCTION SOFTWARE &amp; LIVE SYSTEMS</text>
          <rect class="cursor-blink" x="412" y="-3" width="8" height="13" rx="1.5" fill="#38BDF8"/>
        </g>
      </g>

      <!-- VHF CHANNEL 16 AUDIO & SIGNAL SPECTRUM ANALYZER -->
      <g transform="translate(20, 264)">
        <rect width="570" height="46" rx="6" fill="#020917" stroke="#0E7490" stroke-width="1"/>
        <text x="14" y="27" fill="#38BDF8" class="font-mono" font-size="10" font-weight="700">156.800 MHz [VHF CH 16 SENTINEL]</text>
        <circle cx="218" cy="23" r="3" fill="#34D399" class="pulse-dot"/>
        <text x="226" y="27" fill="#34D399" class="font-mono" font-size="9" font-weight="700">ACTIVE</text>

        <!-- 24 Staggered Equalizer Bars -->
        <g transform="translate(286, 12)">
          <rect class="eq-bar eq-1" x="0" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-2" x="7" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-3" x="14" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-4" x="21" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-5" x="28" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-6" x="35" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-7" x="42" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-8" x="49" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-9" x="56" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-10" x="63" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-11" x="70" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-12" x="77" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-3" x="84" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-5" x="91" width="4" rx="2" fill="#A78BFA"/>
          <rect class="eq-bar eq-7" x="98" width="4" rx="2" fill="#A78BFA"/>
          <rect class="eq-bar eq-1" x="105" width="4" rx="2" fill="#A78BFA"/>
          <rect class="eq-bar eq-8" x="112" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-2" x="119" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-9" x="126" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-4" x="133" width="4" rx="2" fill="#34D399"/>
          <rect class="eq-bar eq-11" x="140" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-6" x="147" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-10" x="154" width="4" rx="2" fill="#38BDF8"/>
          <rect class="eq-bar eq-12" x="161" width="4" rx="2" fill="#38BDF8"/>
        </g>
        
        <text x="554" y="27" text-anchor="end" fill="#94A3B8" class="font-mono" font-size="9.5">AUDIO SPECTRUM // OK</text>
      </g>
    </g>

    <!-- RIGHT PANEL: Holographic Multi-Axis Radar Array -->
    <g transform="translate(930, 195)">
      <!-- System Geo-Coordinates Header Pill -->
      <g transform="translate(-140, -155)">
        <rect width="280" height="28" rx="14" fill="#07152B" stroke="#0E7490" stroke-width="1"/>
        <circle cx="16" cy="14" r="4" fill="#34D399">
          <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="28" y="18" fill="#BAE6FD" class="font-mono" font-size="10.5" font-weight="700" letter-spacing="1">LOCATION: ISTANBUL // TR-34</text>
      </g>

      <!-- Outer Degree Scale & Radar Rings -->
      <circle r="128" stroke="#0E7490" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="4 6" fill="none"/>
      <circle r="96" stroke="#0E7490" stroke-width="1.2" stroke-opacity="0.5" fill="none"/>
      <circle r="64" stroke="#0E7490" stroke-width="1" stroke-opacity="0.65" fill="none"/>
      <circle r="32" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8" fill="#0C4A6E" fill-opacity="0.4"/>

      <!-- Degree Markings -->
      <text x="0" y="-136" text-anchor="middle" fill="#7DD3FC" class="font-mono" font-size="9" font-weight="700">000°</text>
      <text x="144" y="3" text-anchor="start" fill="#7DD3FC" class="font-mono" font-size="9" font-weight="700">090°</text>
      <text x="0" y="145" text-anchor="middle" fill="#7DD3FC" class="font-mono" font-size="9" font-weight="700">180°</text>
      <text x="-144" y="3" text-anchor="end" fill="#7DD3FC" class="font-mono" font-size="9" font-weight="700">270°</text>

      <!-- Axes -->
      <line x1="-128" y1="0" x2="128" y2="0" stroke="#0E7490" stroke-width="1" stroke-opacity="0.4"/>
      <line x1="0" y1="-128" x2="0" y2="128" stroke="#0E7490" stroke-width="1" stroke-opacity="0.4"/>

      <!-- Rotating Sweep Beam -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4.2s" repeatCount="indefinite"/>
        <path d="M0 0 L110 -64 A128 128 0 0 0 64 -110 Z" fill="url(#radar-sweep)"/>
        <line x1="0" y1="0" x2="110" y2="-64" stroke="#38BDF8" stroke-width="2"/>
      </g>

      <!-- Reverse Orbiting Ring (Counter-Clockwise) -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="14s" repeatCount="indefinite"/>
        <circle cx="96" cy="0" r="3" fill="#A78BFA"/>
        <circle cx="-96" cy="0" r="3" fill="#38BDF8"/>
      </g>

      <!-- Dynamic AIS Target Blips -->
      <g transform="translate(56, -42)">
        <circle class="blip-pulse" r="4" fill="#38BDF8"/>
        <line x1="0" y1="0" x2="16" y2="-12" stroke="#38BDF8" stroke-width="1"/>
        <text x="20" y="-12" fill="#BAE6FD" class="font-mono" font-size="9.5" font-weight="700">MMSI 271044</text>
      </g>

      <g transform="translate(-48, 54)">
        <circle r="3.5" fill="#34D399"/>
        <line x1="0" y1="0" x2="-14" y2="12" stroke="#34D399" stroke-width="1"/>
        <text x="-70" y="24" fill="#A7F3D0" class="font-mono" font-size="9.5">CPA: 1.8 NM</text>
      </g>

      <g transform="translate(32, 68)">
        <circle r="3.5" fill="#F59E0B">
          <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
        </circle>
        <text x="40" y="72" fill="#FDE68A" class="font-mono" font-size="9">WIND 24KT</text>
      </g>

      <!-- Core Center -->
      <circle r="4" fill="#FFFFFF"/>

      <!-- Radar Bottom Label -->
      <g transform="translate(-105, 155)">
        <rect width="210" height="24" rx="6" fill="#030B1A" stroke="#164E63" stroke-width="1"/>
        <text x="105" y="16" text-anchor="middle" fill="#7DD3FC" class="font-mono" font-size="10" font-weight="700" letter-spacing="1.5">TELEMETRY: BROADCASTING</text>
      </g>
    </g>

    <!-- Bottom Aesthetic Curve Line -->
    <path d="M0 398C280 380 420 412 640 394C860 376 1020 410 1200 388" stroke="url(#violet-glow)" stroke-width="2.5" opacity="0.8"/>
    
    <!-- Outer Frame Border -->
    <rect x="1" y="1" width="1198" height="418" rx="21" stroke="#0E7490" stroke-opacity="0.5"/>
  </g>
</svg>