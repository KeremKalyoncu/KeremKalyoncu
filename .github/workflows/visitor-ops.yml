name: Aero Guestbook / Verified Issue Events

on:
  issues:
    types: [opened]

concurrency:
  group: aero-guestbook-commit
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  write-guestbook:
    if: startsWith(github.event.issue.title, '[AERO-HELLO]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record real issue event
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: node scripts/process-visitor-command.mjs

      - name: Commit verified guestbook entry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs(guestbook): record GitHub issue #${{ github.event.issue.number }}"
          for retry in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep $((retry * 3))
          done
          exit 1

      - name: Confirm and close issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Thanks for visiting the Aero guestbook! Your greeting is recorded in the profile README."
          gh issue close "$ISSUE_NUMBER" --reason completed
