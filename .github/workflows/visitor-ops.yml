name: Visitor Issue-Ops Command Console

on:
  issues:
    types: [opened]

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process-command:
    if: startsWith(github.event.issue.title, '[OPS-COMMAND]')
    runs-on: ubuntu-latest
    name: execute-visitor-command
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run command processor
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
        run: |
          node scripts/process-visitor-command.mjs

      - name: Comment and close issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment $ISSUE_NUMBER --body "🛰️ **Command Received & Executed** | Telemetry response logged to profile console for @$USER. Closing session."
          gh issue close $ISSUE_NUMBER

      - name: Commit and push updated log
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes."
            exit 0
          fi

          git commit -m "chore(ops): log terminal command from @${{ github.event.issue.user.login }}"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push conflicted; retrying in ${attempt}0 seconds..."
            sleep $((attempt * 10))
          done

          echo "Could not push command log."
          exit 1
