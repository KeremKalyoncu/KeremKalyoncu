name: Generate contribution snake

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/snake.yml"
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-contribution-snake
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark

      - name: Move and commit generated animation
        run: |
          mkdir -p output
          cp dist/github-contribution-grid-snake.svg output/github-contribution-grid-snake.svg
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add output/github-contribution-grid-snake.svg
          if git diff --cached --quiet; then
            echo "No snake animation changes."
            exit 0
          fi

          git commit -m "chore: update contribution snake"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push conflicted; retrying in ${attempt}0 seconds..."
            sleep $((attempt * 10))
          done

          echo "Could not push the generated contribution snake."
          exit 1