name: Generate 3D contribution profile

on:
  push:
    paths:
      - "README.md"
      - "assets/**"
      - ".github/workflows/profile-3d.yml"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: profile-visuals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit generated contribution artwork
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib
          if git diff --cached --quiet; then
            echo "No 3D contribution changes."
            exit 0
          fi

          git commit -m "chore: update 3D contribution profile"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push conflicted; retrying in ${attempt}0 seconds..."
            sleep $((attempt * 10))
          done

          echo "Could not push the generated 3D contribution profile."
          exit 1